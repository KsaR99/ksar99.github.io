<template id="tpl-screen-options">
    <section class="screen">
        <h2 class="screen__title" data-i18n="screens.options.title">OPTIONS</h2>
        <p class="screen__hint">
            <span data-i18n="screens.options.closeHintBefore">Press</span> <kbd class="kbd kbd--clickable"
                                                                                data-role="options-close-key">O</kbd>
            <span
                data-i18n="screens.options.closeHintAfter">to close</span>
        </p>

        <div class="options__panels" data-role="options-panels">
            <section aria-labelledby="options-general-title" class="options" data-role="options-group-general">
                <h3 class="options__title options__title--static options__title--general"
                    data-i18n="screens.options.generalTitle" id="options-general-title">General</h3>
                <label class="options__row">
                    <span data-i18n="screens.options.language">Language</span>
                    <select class="options__input options__input--select" data-role="lang-select"></select>
                </label>
                <div class="options__row">
                    <span data-i18n="screens.options.volume">Volume</span>
                    <div class="options__volume-control">
                        <button aria-pressed="false" class="options__preview-button"
                                data-role="options-mute-toggle" type="button">
                            <span aria-hidden="true" data-role="options-mute-toggle-icon">🔊</span>
                        </button>
                        <input class="options__input options__input--range" data-role="volume-slider" max="100"
                               min="0" type="range">
                    </div>
                </div>
                <label class="options__row">
                    <span data-i18n="screens.options.hudRight">HUD on the right</span>
                    <input class="options__input options__input--checkbox" data-role="hud-right-checkbox"
                           type="checkbox">
                </label>
                <details class="options__theme-picker" data-role="theme-details">
                    <summary class="options__row">
                        <span data-i18n="screens.options.theme">Screen filter</span>
                        <span class="options__theme-current" data-role="theme-current"></span>
                    </summary>
                    <div class="options__theme-grid" data-role="theme-grid">
                        <button class="options__theme-card options__theme-card--none" data-role="theme-option"
                                data-value="none" type="button">
                            <span aria-hidden="true" class="options__theme-preview"></span>
                            <span class="options__theme-card-label"
                                  data-i18n="screens.options.themeNone">None</span>
                        </button>
                        <button class="options__theme-card options__theme-card--vhs" data-role="theme-option"
                                data-value="vhs" type="button">
                            <span aria-hidden="true" class="options__theme-preview"></span>
                            <span class="options__theme-card-label"
                                  data-i18n="screens.options.themeVHS">VHS noise</span>
                        </button>
                        <button class="options__theme-card options__theme-card--matrix" data-role="theme-option"
                                data-value="matrix" type="button">
                            <span aria-hidden="true" class="options__theme-preview"></span>
                            <span class="options__theme-card-label"
                                  data-i18n="screens.options.themeMatrix">Matrix</span>
                        </button>
                        <button class="options__theme-card options__theme-card--rain" data-role="theme-option"
                                data-value="rain" type="button">
                            <span aria-hidden="true" class="options__theme-preview"></span>
                            <span class="options__theme-card-label"
                                  data-i18n="screens.options.themeRain">Rain</span>
                        </button>
                        <button class="options__theme-card options__theme-card--snow" data-role="theme-option"
                                data-value="snow" type="button">
                            <span aria-hidden="true" class="options__theme-preview"></span>
                            <span class="options__theme-card-label"
                                  data-i18n="screens.options.themeSnow">Snow</span>
                        </button>
                        <button class="options__theme-card options__theme-card--volcano" data-role="theme-option"
                                data-value="volcano" type="button">
                            <span aria-hidden="true" class="options__theme-preview"></span>
                            <span class="options__theme-card-label"
                                  data-i18n="screens.options.themeVolcano">Volcano</span>
                        </button>
                    </div>
                </details>
                <div class="options__row options__row--end">
                    <button class="options__preview-button options__preview-button--wide"
                            data-i18n="screens.options.resetDefaults"
                            data-role="reset-general-button" hidden type="button">Reset to defaults
                    </button>
                </div>
            </section>

            <div class="options__search" data-role="options-search">
                <input class="options__search-input" data-i18n-placeholder="screens.options.searchPlaceholder"
                       data-role="options-search-input" placeholder="Search options…" type="search">
                <p class="options__search-empty" data-i18n="screens.options.searchNoResults"
                   data-role="options-search-empty" hidden>No matching options</p>
            </div>

            <details class="options" data-role="options-group-gameplay">
                <summary class="options__title options__title--gameplay" data-i18n="screens.options.gameplayTitle">
                    Gameplay
                </summary>
                <label class="options__row">
                    <span data-i18n="screens.options.skipCountdown">Skip countdown</span>
                    <input class="options__input options__input--checkbox" data-role="skip-countdown-checkbox"
                           type="checkbox">
                </label>

                <label class="options__row">
                    <span data-i18n="screens.options.skipModeInfo">Skip mode info screen</span>
                    <input class="options__input options__input--checkbox" data-role="skip-mode-info-checkbox"
                           type="checkbox">
                </label>
                <label class="options__row">
                    <span data-i18n="screens.options.ghost">Ghost piece</span>
                    <input class="options__input options__input--checkbox" data-role="ghost-checkbox" type="checkbox">
                </label>
                <label class="options__row">
                    <span data-i18n="screens.options.gridLines">Grid lines</span>
                    <input class="options__input options__input--checkbox" data-role="grid-checkbox" type="checkbox">
                </label>
                <label class="options__row">
                    <span data-i18n="screens.options.heightSaturation">Height saturation</span>
                    <input class="options__input options__input--checkbox" data-role="height-saturation-checkbox"
                           type="checkbox">
                </label>
                <div class="options__row options__row--end">
                    <button class="options__preview-button options__preview-button--wide"
                            data-i18n="screens.options.resetDefaults"
                            data-role="reset-gameplay-button" hidden type="button">Reset to defaults
                    </button>
                </div>
            </details>

            <details class="options" data-role="options-group-graphics">
                <summary class="options__title options__title--graphics" data-i18n="screens.options.graphicsTitle">
                    Graphics
                </summary>
                <label class="options__row">
                    <span data-i18n="screens.options.screenShake">Screen shake</span>
                    <input class="options__input options__input--checkbox options__input--desktop-only"
                           data-role="screen-shake-checkbox"
                           type="checkbox">
                </label>

                <details class="options__group" data-role="options-group-performance">
                    <summary class="options__group-summary options__group-summary--performance"
                             data-i18n="screens.options.performanceTitle">Performance
                    </summary>
                    <label class="options__row">
                        <span data-i18n="screens.options.glow">Glow (blur)</span>
                        <input class="options__input options__input--checkbox" data-role="glow-checkbox"
                               type="checkbox">
                    </label>
                    <label class="options__row">
                        <span data-i18n="screens.options.transparency">Transparency</span>
                        <input class="options__input options__input--checkbox" data-role="transparency-checkbox"
                               type="checkbox">
                    </label>
                    <label class="options__row">
                        <span data-i18n="screens.options.fallTrail">Fall trail</span>
                        <input class="options__input options__input--checkbox" data-role="fall-trail-checkbox"
                               type="checkbox">
                    </label>
                </details>
                <div class="options__row options__row--end">
                    <button class="options__preview-button options__preview-button--wide"
                            data-i18n="screens.options.resetDefaults"
                            data-role="reset-graphics-button" hidden type="button">Reset to defaults
                    </button>
                </div>
            </details>

            <details class="options" data-role="options-group-sound">
                <summary class="options__title options__title--sound" data-i18n="screens.options.soundTitle">Sound
                </summary>

                <details class="options__group" data-role="sound-group-sfx">
                    <summary class="options__group-summary options__group-summary--sfx"
                             data-i18n="screens.options.sfxTitle">SFX
                    </summary>
                    <div class="options__row">
                        <span data-i18n="screens.options.categoryVolume">Category volume</span>
                        <div class="options__volume-control">
                            <button aria-pressed="false" class="options__preview-button" data-category="sfx"
                                    data-role="category-mute-toggle" type="button">
                                <span aria-hidden="true" data-role="category-mute-toggle-icon">🔊</span>
                            </button>
                            <input class="options__input options__input--range" data-category="sfx"
                                   data-role="category-volume-slider" max="100"
                                   min="0" type="range">
                        </div>
                    </div>
                    <div class="options__sound-list" data-role="sound-list"></div>
                    <div class="options__row options__row--end">
                        <button class="options__preview-button options__preview-button--wide"
                                data-i18n="screens.options.resetDefaults"
                                data-role="reset-sfx-button" hidden type="button">Reset to defaults
                        </button>
                    </div>
                </details>

                <details class="options__group" data-role="sound-group-music">
                    <summary class="options__group-summary options__group-summary--music"
                             data-i18n="screens.options.musicTitle">Music
                    </summary>
                    <div class="options__row">
                        <span data-i18n="screens.options.categoryVolume">Category volume</span>
                        <div class="options__volume-control">
                            <button aria-pressed="false" class="options__preview-button" data-category="music"
                                    data-role="category-mute-toggle" type="button">
                                <span aria-hidden="true" data-role="category-mute-toggle-icon">🔊</span>
                            </button>
                            <input class="options__input options__input--range" data-category="music"
                                   data-role="category-volume-slider" max="100"
                                   min="0" type="range">
                        </div>
                    </div>
                    <div class="options__sound-list" data-role="sound-list"></div>
                    <div class="options__row options__row--end">
                        <button class="options__preview-button options__preview-button--wide"
                                data-i18n="screens.options.resetDefaults"
                                data-role="reset-music-button" hidden type="button">Reset to defaults
                        </button>
                    </div>
                </details>

                <details class="options__group" data-role="sound-group-voices">
                    <summary class="options__group-summary options__group-summary--voices"
                             data-i18n="screens.options.voicesTitle">Voices
                    </summary>
                    <div class="options__row">
                        <span data-i18n="screens.options.categoryVolume">Category volume</span>
                        <div class="options__volume-control">
                            <button aria-pressed="false" class="options__preview-button" data-category="voices"
                                    data-role="category-mute-toggle" type="button">
                                <span aria-hidden="true" data-role="category-mute-toggle-icon">🔊</span>
                            </button>
                            <input class="options__input options__input--range" data-category="voices"
                                   data-role="category-volume-slider" max="100"
                                   min="0" type="range">
                        </div>
                    </div>
                    <div class="options__sound-list" data-role="sound-list"></div>

                    <details class="options__group" data-role="sound-group-voices-countdown">
                        <summary class="options__group-summary options__group-summary--countdown"
                                 data-i18n="screens.options.countdownTitle">Countdown
                        </summary>
                        <div class="options__sound-list" data-role="sound-list-countdown"></div>
                    </details>

                    <div class="options__row options__row--end">
                        <button class="options__preview-button options__preview-button--wide"
                                data-i18n="screens.options.resetDefaults"
                                data-role="reset-voices-button" hidden type="button">Reset to defaults
                        </button>
                    </div>
                </details>
            </details>

            <details class="options" data-role="options-group-controls">
                <summary class="options__title options__title--controls" data-i18n="screens.options.controlsTitle">
                    Controls
                </summary>
                <label class="options__row">
                    <span data-i18n="screens.options.touchSensitivity">Touch sensitivity</span>
                    <input class="options__input options__input--number"
                           data-i18n-placeholder="screens.options.autoValue"
                           data-role="touch-sensitivity-input"
                           inputmode="decimal"
                           max="2" min="0.5" placeholder="auto" step="0.05" type="number">
                </label>
                <div class="options__row options__row--end">
                    <button
                        class="options__preview-button options__preview-button--wide options__preview-button--reset-controls"
                        data-i18n="screens.options.resetDefaults"
                        data-role="reset-controls-button" hidden type="button">Reset to defaults
                    </button>
                </div>

                <details class="options__group options__group--mouse" data-role="options-group-mouse">
                    <summary class="options__group-summary options__group-summary--mouse"
                             data-i18n="screens.options.mouseTitle">Mouse
                    </summary>
                    <label class="options__row">
                        <span data-i18n="screens.options.mouseControl">Mouse control</span>
                        <input class="options__input options__input--checkbox options__input--desktop-only"
                               data-role="mouse-control-checkbox"
                               type="checkbox">
                    </label>
                    <label class="options__row">
                        <span data-i18n="screens.options.mouseSensitivity">Mouse sensitivity</span>
                        <input class="options__input options__input--number options__input--desktop-only"
                               data-role="mouse-sensitivity-input"
                               inputmode="decimal"
                               type="number">
                    </label>
                    <div class="options__row">
                        <span data-i18n="screens.options.calibrateSensitivity">Calibrate sensitivity</span>
                        <button
                            class="options__preview-button options__preview-button--wide options__input--desktop-only"
                            data-i18n="screens.options.calibrateSensitivityButton"
                            data-role="calibrate-sensitivity-button"
                            type="button">Calibrate
                        </button>
                    </div>
                </details>

                <details class="options__group options__group--keyboard" data-role="options-group-keyboard">
                    <summary class="options__group-summary options__group-summary--keyboard"
                             data-i18n="screens.options.keyboardTitle">Keyboard
                    </summary>
                    <p class="options__hint" data-i18n="screens.options.keyboardHint">Click a key to reassign it</p>
                    <ul class="controls__list controls__list--keys" data-role="keybind-list"></ul>
                    <ul class="controls__list controls__list--touch">
                        <li class="controls__item">
                            <span data-i18n="controls.rotate">Rotate</span>
                            <span data-i18n="controls.touchRotateGesture">Tap board</span>
                        </li>
                        <li class="controls__item">
                            <span data-i18n="controls.touchMove">Move</span>
                            <span data-i18n="controls.touchMoveGesture">Drag on board</span>
                        </li>
                        <li class="controls__item">
                            <span data-i18n="controls.softDrop">Soft drop</span>
                            <span data-i18n="controls.touchSoftDropGesture">Hold ▼</span>
                        </li>
                        <li class="controls__item">
                            <span data-i18n="controls.hardDrop">Hard drop</span>
                            <span data-i18n="controls.touchHardDropGesture">Swipe down</span>
                        </li>
                        <li class="controls__item">
                            <span data-i18n="controls.pause">Pause</span>
                            <span data-i18n="controls.touchPauseGesture">❚❚ button</span>
                        </li>
                    </ul>
                    <div class="options__row">
                        <span data-i18n="screens.options.keyboardReset" data-role="keybind-reset-label" hidden>Reset keys</span>
                        <button
                            class="options__preview-button options__preview-button--wide options__preview-button--keybind-reset"
                            data-i18n="screens.options.keyboardResetButton"
                            data-role="keybind-reset-button" hidden type="button">Reset to defaults
                        </button>
                    </div>

                    <details class="options__group options__group--advanced" data-role="options-group-advanced">
                        <summary class="options__group-summary options__group-summary--advanced"
                                 data-i18n="screens.options.advancedTitle">Advanced
                        </summary>
                        <label class="options__row">
                            <span data-i18n="screens.options.keyboardDas">Keyboard DAS (ms)</span>
                            <input class="options__input options__input--number" data-role="keyboard-das-input"
                                   inputmode="numeric"
                                   type="number">
                        </label>
                        <label class="options__row">
                            <span data-i18n="screens.options.keyboardArr">Keyboard ARR (ms)</span>
                            <input class="options__input options__input--number" data-role="keyboard-arr-input"
                                   inputmode="numeric"
                                   type="number">
                        </label>
                        <div class="options__row">
                            <span data-i18n="screens.options.calibrateKeyboard">Calibrate keyboard</span>
                            <button class="options__preview-button options__preview-button--wide"
                                    data-i18n="screens.options.calibrateKeyboardButton"
                                    data-role="calibrate-keyboard-button"
                                    type="button">
                            </button>
                        </div>
                        <div class="options__row options__row--end">
                            <button class="options__preview-button options__preview-button--wide"
                                    data-i18n="screens.options.resetDefaults"
                                    data-role="reset-advanced-button" hidden type="button">Reset to defaults
                            </button>
                        </div>
                    </details>
                </details>
            </details>

            <details class="options" data-role="options-group-developer" hidden>
                <summary class="options__title" data-i18n="screens.options.developerTitle">Developer</summary>
                <p class="options__hint" data-i18n="screens.options.benchmarkHint">Simulates a fast random game and
                    times each part of the engine to find the slowest one.</p>
                <div class="options__row">
                    <span data-i18n="screens.options.benchmark">Benchmark</span>
                    <button class="options__preview-button options__preview-button--wide"
                            data-i18n="screens.options.benchmarkButton"
                            data-role="benchmark-run-button"
                            type="button">Run benchmark
                    </button>
                </div>
                <canvas class="options__benchmark-preview" data-role="benchmark-preview-canvas" hidden></canvas>
                <p class="options__hint" data-role="benchmark-status" hidden></p>
                <ul class="options__benchmark-results" data-role="benchmark-results" hidden></ul>
                <div class="options__row">
                    <button class="options__preview-button options__preview-button--wide"
                            data-i18n="screens.options.benchmarkCopyButton"
                            data-role="benchmark-copy-button"
                            hidden type="button">Copy results
                    </button>
                </div>
            </details>

            <section aria-labelledby="options-data-title" class="options" data-role="options-group-data">
                <h3 class="options__title options__title--static" data-i18n="screens.options.dataTitle"
                    id="options-data-title">Import /
                    Export</h3>
                <div class="options__row">
                    <span data-i18n="screens.options.exportLabel">Export options to a file</span>
                    <button class="options__preview-button options__preview-button--wide"
                            data-i18n="screens.options.exportButton"
                            data-role="options-export-button"
                            type="button">Export
                    </button>
                </div>
                <div class="options__row">
                    <span data-i18n="screens.options.importLabel">Import options from a file</span>
                    <button class="options__preview-button options__preview-button--wide"
                            data-i18n="screens.options.importButton"
                            data-role="options-import-button"
                            type="button">Import
                    </button>
                    <input accept="application/json" data-role="options-import-file" hidden type="file">
                </div>
            </section>
        </div>

        <section aria-labelledby="options-import-title" class="options options__import-review"
                 data-role="options-import-review" hidden>
            <h3 class="options__title options__title--static" data-i18n="screens.options.importDiffTitle"
                id="options-import-title">Import
                options</h3>
            <p class="options__import-review__subtitle" data-role="options-import-subtitle"></p>

            <p class="options__import-review__empty" data-i18n="screens.options.importNoChanges"
               data-role="options-import-empty" hidden>
                The imported file matches your current options — nothing to change.
            </p>
            <p class="options__import-review__empty" data-i18n="screens.options.importInvalid"
               data-role="options-import-invalid" hidden>
                This file doesn't look like a valid options export.
            </p>

            <label class="options__row options__row--select-all" data-role="options-import-select-all-row">
                <span data-i18n="screens.options.importSelectAll">Select all</span>
                <input class="options__input options__input--checkbox" data-role="options-import-select-all"
                       type="checkbox">
            </label>

            <div class="options__import-review__list" data-role="options-import-list"></div>

            <div class="options__import-review__actions" data-role="options-import-actions">
                <button class="button" data-i18n="screens.options.importCancel" data-role="options-import-cancel"
                        type="button">Cancel
                </button>
                <button class="button button--accent" data-i18n="screens.options.importApply"
                        data-role="options-import-apply"
                        type="button">Apply selected
                </button>
            </div>
            <button class="button button--accent" data-i18n="screens.options.importClose"
                    data-role="options-import-close"
                    hidden
                    type="button">OK
            </button>
        </section>

        <button class="options__resume button button--accent" data-i18n="screens.options.close"
                data-role="options-close-button"
                type="button">Close
        </button>
    </section>
</template>

<template id="tpl-options-diff-row">
    <label class="options__row options__row--diff" data-role="options-diff-row">
        <span class="options__diff-label" data-field="label"></span>
        <span class="options__diff-value">
            <span class="options__diff-value--old" data-field="oldValue"></span>
            <span aria-hidden="true" class="options__diff-value__arrow">→</span>
            <span class="options__diff-value--new" data-field="newValue"></span>
        </span>
        <input class="options__input options__input--checkbox" data-role="options-diff-checkbox" type="checkbox">
    </label>
</template>

<template id="tpl-benchmark-row">
    <li class="options__benchmark-row" data-role="benchmark-row">
        <span class="options__benchmark-label" data-field="label"></span>
        <span class="options__benchmark-value" data-field="value"></span>
    </li>
</template>
<template id="tpl-options-sound-row">
    <div class="options__row options__row--sound" data-role="sound-row">
        <span class="options__sound-name" data-field="name"></span>
        <div class="options__volume-control">
            <button aria-pressed="false" class="options__preview-button" data-role="sound-mute-toggle"
                    type="button">
                <span aria-hidden="true" data-role="sound-mute-toggle-icon">🔊</span>
            </button>
            <input class="options__input options__input--range" data-role="sound-volume-slider" max="100" min="0"
                   type="range">
        </div>
        <button class="options__preview-button" data-role="sound-preview-button" type="button">▶</button>
    </div>
</template>
