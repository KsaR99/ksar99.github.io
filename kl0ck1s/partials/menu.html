<template id="tpl-screen-idle">
    <section class="screen screen--menu">
        <h2 class="screen__title">Kl0ck1's</h2>
        <p class="screen__hint" data-i18n="screens.idle.modeHint">Choose mode</p>
        <div class="difficulty difficulty--modes difficulty--carousel" data-role="mode-select">
            <button aria-label="Previous mode" class="difficulty__nav" data-role="mode-prev" type="button">◄</button>
            <div class="difficulty__current">
                <span class="difficulty__label" data-field="modeLabel"></span>
            </div>
            <button aria-label="Next mode" class="difficulty__nav" data-role="mode-next" type="button">►</button>
        </div>
        <div class="mode-info__description" data-field="modeDescription" data-role="mode-description"></div>
        <p class="screen__hint" data-i18n="screens.idle.hint">Choose difficulty</p>
        <div class="difficulty difficulty--carousel" data-role="difficulty-select">
            <button aria-label="Previous difficulty" class="difficulty__nav" data-role="difficulty-prev"
                    type="button">◄
            </button>
            <div class="difficulty__current">
                <span class="difficulty__label" data-field="difficultyLabel"></span>
                <span class="difficulty__level" data-field="difficultyLevel"></span>
            </div>
            <button aria-label="Next difficulty" class="difficulty__nav" data-role="difficulty-next" type="button">►
            </button>
        </div>
        <div class="nickname-form">
            <select aria-label="Profile" class="nickname-form__select" data-i18n-title="screens.idle.profileSelectLabel"
                    data-role="profile-select"></select>
            <input class="nickname-form__input" data-i18n-placeholder="screens.idle.namePlaceholder"
                   data-role="name-input" maxlength="16"
                   name="nickname" pattern="[a-zA-Z\d_\-]{3,16}"
                   placeholder="Your nickname"
                   required type="text">
            <button aria-label="Delete profile" class="nickname-form__delete-button"
                    data-i18n-title="screens.idle.deleteProfileButton" data-role="delete-profile-button"
                    type="button">🗑
            </button>
        </div>

        <div class="screen__button-row">
            <button class="button button--accent" data-i18n="screens.idle.startButton"
                    data-role="start-button" type="button">Start
            </button>
            <button class="button button--primary" data-role="multiplayer-button" type="button">🌐 <span
                data-i18n="multiplayer.button">Multiplayer</span>
            </button>
        </div>
        <section aria-label="Leaderboard" class="leaderboard" data-role="leaderboard-section">
            <div class="leaderboard__header">
                <h3 class="leaderboard__title" data-i18n="leaderboard.title">Leaderboard</h3>
                <button aria-label="Share leaderboard" class="leaderboard__share-button"
                        data-i18n-title="leaderboard.shareButton" data-role="leaderboard-share-button"
                        type="button">📤
                </button>
            </div>
            <div data-field="leaderboard"></div>
        </section>
    </section>
</template>
