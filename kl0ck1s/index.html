<!DOCTYPE html>
<html lang="en" translate="no">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport">
    <title>Kl0ck1's</title>
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Noto+Sans+Mono:wght@100..900&display=swap"
        rel="stylesheet"
    >
    <link href="styles/main.css?v=38" rel="stylesheet">
    <link href="styles/mobile.css?v=38" media="(width < 48rem)" rel="stylesheet">
    <link href="styles/desktop.css?v=38" media="(width >= 48rem)" rel="stylesheet">
    <meta content="notranslate" name="google">
    <meta content="https://github.com/KsaR99" name="author">
    <meta content="index, follow" name="robots">
    <meta content="Tetris-like game, with multiple themes & modes." name="description">
</head>
<body>
<div class="boot-screen" id="boot-screen">
    <div class="boot-screen__inner">
        <p class="boot-screen__logo">Kl0ck1<span class="boot-screen__logo-flip">'s</span></p>
        <div class="boot-screen__bar-track">
            <div class="boot-screen__bar-fill" id="boot-bar-fill"></div>
        </div>
        <p class="boot-screen__status" id="boot-status">&nbsp;</p>
    </div>
</div>
<div class="confirm-overlay" data-role="confirm-overlay" hidden>
    <div aria-modal="true" class="confirm-dialog" data-role="confirm-dialog" role="alertdialog">
        <p class="confirm-dialog__message" data-field="confirm-message"></p>
        <div class="confirm-dialog__actions screen__button-row">
            <button class="button button--primary" data-i18n="controls.cancel" data-role="confirm-cancel-button"
                    type="button">Cancel
            </button>
            <button class="button button--accent" data-i18n="controls.confirm" data-role="confirm-ok-button"
                    type="button">Confirm
            </button>
        </div>
    </div>
</div>
<div class="app" id="app-root">
    <div class="mobile-fabs">
        <div class="mobile-fabs__group">
            <button aria-label="Stats" class="mobile-fab" data-role="fab-stats" type="button">📊</button>
            <button aria-label="Controls" class="mobile-fab" data-role="fab-controls" type="button">❓</button>
        </div>
        <div class="mobile-fabs__group">
            <button aria-label="Fullscreen" aria-pressed="false" class="mobile-fab" data-role="fab-fullscreen"
                    type="button">⛶
            </button>
        </div>
    </div>
    <div class="drawer-scrim" data-role="drawer-scrim"></div>

    <div class="app__sidebar sidebar sidebar--stats">
        <button aria-label="Close" class="drawer-close" data-role="drawer-close" type="button">✕</button>
        <div class="card">
            <p class="brand__title" data-role="brand-title">Kl0ck1<span class="brand__title-flip"
                                                                        data-role="brand-title-flip">'s</span></p>
            <p class="brand__subtitle brand__subtitle--clickable" data-role="brand-version">v0.14-alpha</p>
            <div class="settings-shortcut-row">
                <button aria-label="Mute sound" aria-pressed="false" class="settings-shortcut-icon"
                        data-role="mute-toggle" type="button">
                    <span aria-hidden="true" data-role="mute-toggle-icon">🔊</span>
                </button>
                <button aria-label="Fullscreen" aria-pressed="false" class="settings-shortcut-icon"
                        data-role="fullscreen-toggle" type="button">
                    <span aria-hidden="true">⛶</span>
                </button>
                <button aria-label="Options" class="settings-shortcut-icon" data-role="settings-shortcut"
                        type="button">
                    <span aria-hidden="true">⚙️</span>
                </button>
            </div>
        </div>

        <div class="card stats" data-role="stats-card">
            <p class="stats__status" data-i18n="sidebar.statusLast" data-role="stats-status">Last game</p>
            <div class="stats__row" data-role="time-stat">
                <h3 class="card__title" data-i18n="sidebar.time">Time</h3>
                <div class="stats__value" id="time-value">00:00</div>
            </div>
            <div class="stats__row">
                <h3 class="card__title" data-i18n="sidebar.best">Best</h3>
                <div class="stats__value" id="best-value">0</div>
            </div>
            <div class="stats__row">
                <h3 class="card__title" data-i18n="sidebar.score">Score</h3>
                <div class="stats__value" id="score-value">0</div>
            </div>
            <div class="stats__row" data-role="lines-stat">
                <h3 class="card__title" data-i18n="sidebar.lines">Lines</h3>
                <div class="stats__value" id="lines-value">0</div>
            </div>
            <div class="stats__row" data-role="trt-stat">
                <h3 class="card__title" data-i18n="sidebar.tetrisRate">TRT</h3>
                <div class="stats__value" id="trt-value">0.0%</div>
            </div>
            <div class="stats__row" data-role="pps-stat">
                <h3 class="card__title" data-i18n="sidebar.pps">PPS</h3>
                <div class="stats__value" id="pps-value">0.00</div>
            </div>
            <div class="stats__row" data-role="drought-stat">
                <h3 class="card__title" data-i18n="sidebar.drought">Drought</h3>
                <div class="stats__value" id="drought-value">0</div>
            </div>
            <div data-role="objective-stat">
                <div class="progress-bar progress-bar--objective" id="objective-bar-track">
                    <div class="progress-bar__fill" id="objective-bar"></div>
                    <div class="progress-bar__label" id="objective-value">-</div>
                </div>
            </div>
            <div data-role="difficulty-stat">
                <div class="progress-bar progress-bar--difficulty">
                    <div class="progress-bar__fill" id="difficulty-bar"></div>
                    <div class="progress-bar__label" id="difficulty-value">-</div>
                </div>
            </div>
        </div>

        <div class="card" data-role="next-piece-card">
            <h3 class="card__title" data-i18n="sidebar.nextPiece">Next piece</h3>
            <canvas class="next-piece__canvas" height="120" id="next-piece-canvas" width="120"></canvas>
        </div>
    </div>

    <div class="app__board" data-theme="none">
        <div class="board">
            <div class="board__stage">
                <canvas class="board__canvas" height="920" id="klockis-board" width="460"></canvas>
                <div class="board__filter" data-theme="none" id="filter-overlay">
                    <canvas class="board__filter-canvas" id="filter-canvas"></canvas>
                </div>
                <div class="board__overlay" id="overlay"></div>
                <div class="board__calibration" data-role="calibration-banner">
                    <p class="board__calibration__instruction" data-field="instruction"></p>
                    <p class="board__calibration__countdown" data-field="countdown"></p>
                    <div class="progress-bar progress-bar--countdown" data-role="calibration-countdown-progress">
                        <div class="progress-bar__fill" data-role="calibration-countdown-progress-bar"></div>
                    </div>
                    <p class="board__calibration__progress" data-field="progress"></p>
                </div>
                <div aria-hidden="true" class="board__credits" data-role="credits">
                    <div class="board__credits__scroll" data-role="credits-scroll"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="touch-controls" data-role="touch-controls">
        <div class="touch-controls__group touch-controls__group--move">
            <button aria-label="Left" class="touch-controls__btn" data-key-action="ArrowLeft" type="button">◄</button>
            <button aria-label="Right" class="touch-controls__btn" data-key-action="ArrowRight" type="button">►</button>
            <button aria-label="Soft drop" class="touch-controls__btn" data-key-action="ArrowDown" type="button">▼
            </button>
        </div>
        <div class="touch-controls__group touch-controls__group--actions">
            <button aria-label="Rotate" class="touch-controls__btn" data-key-action="ArrowUp" type="button">⟳</button>
            <button aria-label="Hard drop" class="touch-controls__btn touch-controls__btn--wide"
                    data-key-action="Space" type="button">
                <span class="touch-controls__btn-label">⏬</span>
            </button>
            <button aria-label="Pause" class="touch-controls__btn" data-key-action="KeyP" type="button">❚❚</button>
        </div>
    </div>
</div>

<template id="tpl-screen-loading">
    <div class="screen">
        <h2 class="screen__title" data-field="title"></h2>
        <p class="screen__hint" data-field="hint"></p>
    </div>
</template>

<template id="tpl-screen-idle">
    <div class="screen">
        <h2 class="screen__title">Kl0ck1's</h2>
        <p class="screen__hint" data-i18n="screens.idle.modeHint">Choose mode</p>
        <div class="difficulty difficulty--modes difficulty--carousel" data-role="mode-select">
            <button aria-label="Previous mode" class="difficulty__nav" data-role="mode-prev" type="button">◄</button>
            <div class="difficulty__current">
                <span class="difficulty__label" data-field="modeLabel"></span>
            </div>
            <button aria-label="Next mode" class="difficulty__nav" data-role="mode-next" type="button">►</button>
        </div>
        <div class="mode-description" data-field="modeDescription" data-role="mode-description"></div>
        <p class="screen__hint" data-i18n="screens.idle.hint">Choose difficulty</p>
        <div class="difficulty difficulty--carousel" data-role="difficulty-select">
            <button aria-label="Previous difficulty" class="difficulty__nav" data-role="difficulty-prev"
                    type="button">◄
            </button>
            <div class="difficulty__current">
                <span class="difficulty__label" data-field="difficultyLabel"></span>
                <span class="difficulty__level" data-field="difficultyLevel"></span>
            </div>
            <button aria-label="Next difficulty" class="difficulty__nav" data-role="difficulty-next" type="button">►
            </button>
        </div>
        <div class="nickname-form">
            <select aria-label="Profile" class="nickname-form__select" data-i18n-title="screens.idle.profileSelectLabel"
                    data-role="profile-select"></select>
            <input class="nickname-form__input" data-i18n-placeholder="screens.idle.namePlaceholder"
                   data-role="name-input" maxlength="16"
                   name="nickname" pattern="[a-zA-Z\d_\-]{3,16}"
                   placeholder="Your nickname"
                   required type="text">
            <button aria-label="Delete profile" class="nickname-form__delete-button"
                    data-i18n-title="screens.idle.deleteProfileButton" data-role="delete-profile-button"
                    type="button">🗑
            </button>
        </div>

        <button class="button button--accent" data-i18n="screens.idle.startButton"
                data-role="start-button" type="button">Start
        </button>
        <div class="leaderboard">
            <div class="leaderboard__header">
                <h3 class="leaderboard__title" data-i18n="leaderboard.title">Leaderboard</h3>
                <button aria-label="Share leaderboard" class="leaderboard__share-button"
                        data-i18n-title="leaderboard.shareButton" data-role="leaderboard-share-button"
                        type="button">📤
                </button>
            </div>
            <div data-field="leaderboard"></div>
        </div>
    </div>
</template>

<template id="tpl-screen-options">
    <div class="screen">
        <h2 class="screen__title" data-i18n="screens.options.title">OPTIONS</h2>
        <p class="screen__hint">
            <span data-i18n="screens.options.closeHintBefore">Press</span> <kbd class="kbd kbd--clickable"
                                                                                data-role="options-close-key">O</kbd>
            <span
                data-i18n="screens.options.closeHintAfter">to close</span>
        </p>

        <div class="options__panels" data-role="options-panels">
            <div class="options" data-role="options-group-general">
                <h3 class="options__title options__title--static" data-i18n="screens.options.generalTitle">General</h3>
                <label class="options__row">
                    <span data-i18n="screens.options.language">Language</span>
                    <select class="options__input options__input--select" data-role="lang-select"></select>
                </label>
                <label class="options__row">
                    <span data-i18n="screens.options.volume">Volume</span>
                    <input class="options__input options__input--range" data-role="volume-slider" max="100" min="0"
                           type="range">
                </label>
                <label class="options__row">
                    <span data-i18n="screens.options.mute">Mute</span>
                    <input class="options__input options__input--checkbox" data-role="mute-checkbox" type="checkbox">
                </label>
                <label class="options__row">
                    <span data-i18n="screens.options.hudRight">HUD on the right</span>
                    <input class="options__input options__input--checkbox" data-role="hud-right-checkbox"
                           type="checkbox">
                </label>
                <label class="options__row">
                    <span data-i18n="screens.options.theme">Screen filter</span>
                    <select class="options__input options__input--select" data-role="theme-select">
                        <option data-i18n="screens.options.themeNone" value="none">None</option>
                        <option data-i18n="screens.options.themeVHS" value="vhs">VHS noise</option>
                        <option data-i18n="screens.options.themeMatrix" value="matrix">Matrix</option>
                        <option data-i18n="screens.options.themeRain" value="rain">Rain</option>
                        <option data-i18n="screens.options.themeSnow" value="snow">Snow</option>
                    </select>
                </label>
            </div>

            <details class="options" data-role="options-group-controls">
                <summary class="options__title" data-i18n="screens.options.controlsTitle">Controls</summary>
                <label class="options__row">
                    <span data-i18n="screens.options.mouseControl">Mouse control</span>
                    <input class="options__input options__input--checkbox" data-role="mouse-control-checkbox"
                           type="checkbox">
                </label>
                <label class="options__row">
                    <span data-i18n="screens.options.mouseSensitivity">Mouse sensitivity</span>
                    <input class="options__input options__input--number" data-role="mouse-sensitivity-input"
                           inputmode="decimal"
                           type="number">
                </label>
                <label class="options__row">
                    <span data-i18n="screens.options.touchSensitivity">Touch sensitivity</span>
                    <input class="options__input options__input--number" data-role="touch-sensitivity-input"
                           inputmode="decimal"
                           placeholder="auto" type="number">
                </label>
                <div class="options__row">
                    <span data-i18n="screens.options.calibrateSensitivity">Calibrate sensitivity</span>
                    <button class="options__preview-button options__preview-button--wide"
                            data-i18n="screens.options.calibrateSensitivityButton"
                            data-role="calibrate-sensitivity-button"
                            type="button">Calibrate
                    </button>
                </div>

                <details class="options__group" data-role="options-group-keyboard">
                    <summary class="options__group-summary" data-i18n="screens.options.keyboardTitle">Keyboard
                    </summary>
                    <p class="options__hint" data-i18n="screens.options.keyboardHint">Click a key to reassign it</p>
                    <ul class="controls__list controls__list--keys" data-role="keybind-list"></ul>
                    <ul class="controls__list controls__list--touch">
                        <li class="controls__item">
                            <span data-i18n="controls.rotate">Rotate</span>
                            <span data-i18n="controls.touchRotateGesture">Tap board</span>
                        </li>
                        <li class="controls__item">
                            <span data-i18n="controls.touchMove">Move</span>
                            <span data-i18n="controls.touchMoveGesture">Drag on board</span>
                        </li>
                        <li class="controls__item">
                            <span data-i18n="controls.softDrop">Soft drop</span>
                            <span data-i18n="controls.touchSoftDropGesture">Hold ▼</span>
                        </li>
                        <li class="controls__item">
                            <span data-i18n="controls.hardDrop">Hard drop</span>
                            <span data-i18n="controls.touchHardDropGesture">Swipe down</span>
                        </li>
                        <li class="controls__item">
                            <span data-i18n="controls.pause">Pause</span>
                            <span data-i18n="controls.touchPauseGesture">❚❚ button</span>
                        </li>
                    </ul>
                    <div class="options__row">
                        <span data-i18n="screens.options.keyboardReset">Reset keys</span>
                        <button class="options__preview-button options__preview-button--wide"
                                data-i18n="screens.options.keyboardResetButton"
                                data-role="keybind-reset-button" type="button">Reset to defaults
                        </button>
                    </div>
                </details>
            </details>

            <details class="options" data-role="options-group-gameplay">
                <summary class="options__title" data-i18n="screens.options.gameplayTitle">Gameplay</summary>
                <label class="options__row">
                    <span data-i18n="screens.options.skipCountdown">Skip countdown</span>
                    <input class="options__input options__input--checkbox" data-role="skip-countdown-checkbox"
                           type="checkbox">
                </label>
                <label class="options__row">
                    <span data-i18n="screens.options.skipModeInfo">Skip mode info screen</span>
                    <input class="options__input options__input--checkbox" data-role="skip-mode-info-checkbox"
                           type="checkbox">
                </label>
            </details>

            <details class="options" data-role="options-group-sound">
                <summary class="options__title" data-i18n="screens.options.soundTitle">Sound</summary>

                <details class="options__group" data-role="sound-group-sfx">
                    <summary class="options__group-summary" data-i18n="screens.options.sfxTitle">SFX</summary>
                    <label class="options__row">
                        <span data-i18n="screens.options.categoryVolume">Category volume</span>
                        <input class="options__input options__input--range" data-category="sfx"
                               data-role="category-volume-slider" max="100"
                               min="0" type="range">
                    </label>
                    <div class="options__sound-list" data-role="sound-list"></div>
                </details>

                <details class="options__group" data-role="sound-group-music">
                    <summary class="options__group-summary" data-i18n="screens.options.musicTitle">Music</summary>
                    <label class="options__row">
                        <span data-i18n="screens.options.categoryVolume">Category volume</span>
                        <input class="options__input options__input--range" data-category="music"
                               data-role="category-volume-slider" max="100"
                               min="0" type="range">
                    </label>
                    <div class="options__sound-list" data-role="sound-list"></div>
                </details>

                <details class="options__group" data-role="sound-group-voices">
                    <summary class="options__group-summary" data-i18n="screens.options.voicesTitle">Voices</summary>
                    <label class="options__row">
                        <span data-i18n="screens.options.categoryVolume">Category volume</span>
                        <input class="options__input options__input--range" data-category="voices"
                               data-role="category-volume-slider" max="100"
                               min="0" type="range">
                    </label>
                    <div class="options__sound-list" data-role="sound-list"></div>
                </details>
            </details>

            <details class="options" data-role="options-group-graphics">
                <summary class="options__title" data-i18n="screens.options.graphicsTitle">Graphics</summary>
                <label class="options__row">
                    <span data-i18n="screens.options.ghost">Ghost piece</span>
                    <input class="options__input options__input--checkbox" data-role="ghost-checkbox" type="checkbox">
                </label>
                <label class="options__row">
                    <span data-i18n="screens.options.gridLines">Grid lines</span>
                    <input class="options__input options__input--checkbox" data-role="grid-checkbox" type="checkbox">
                </label>
                <label class="options__row">
                    <span data-i18n="screens.options.screenShake">Screen shake</span>
                    <input class="options__input options__input--checkbox" data-role="screen-shake-checkbox"
                           type="checkbox">
                </label>
                <label class="options__row">
                    <span data-i18n="screens.options.heightSaturation">Height saturation</span>
                    <input class="options__input options__input--checkbox" data-role="height-saturation-checkbox"
                           type="checkbox">
                </label>

                <details class="options__group" data-role="options-group-performance">
                    <summary class="options__group-summary" data-i18n="screens.options.performanceTitle">Performance
                    </summary>
                    <label class="options__row">
                        <span data-i18n="screens.options.glow">Glow (blur)</span>
                        <input class="options__input options__input--checkbox" data-role="glow-checkbox"
                               type="checkbox">
                    </label>
                    <label class="options__row">
                        <span data-i18n="screens.options.transparency">Transparency</span>
                        <input class="options__input options__input--checkbox" data-role="transparency-checkbox"
                               type="checkbox">
                    </label>
                    <label class="options__row">
                        <span data-i18n="screens.options.fallTrail">Fall trail</span>
                        <input class="options__input options__input--checkbox" data-role="fall-trail-checkbox"
                               type="checkbox">
                    </label>
                </details>
            </details>

            <details class="options" data-role="options-group-advanced">
                <summary class="options__title" data-i18n="screens.options.advancedTitle">Advanced</summary>
                <label class="options__row">
                    <span data-i18n="screens.options.keyboardDas">Keyboard DAS (ms)</span>
                    <input class="options__input options__input--number" data-role="keyboard-das-input"
                           inputmode="numeric"
                           type="number">
                </label>
                <label class="options__row">
                    <span data-i18n="screens.options.keyboardArr">Keyboard ARR (ms)</span>
                    <input class="options__input options__input--number" data-role="keyboard-arr-input"
                           inputmode="numeric"
                           type="number">
                </label>
                <div class="options__row">
                    <span data-i18n="screens.options.calibrateKeyboard">Calibrate keyboard</span>
                    <button class="options__preview-button options__preview-button--wide"
                            data-i18n="screens.options.calibrateKeyboardButton"
                            data-role="calibrate-keyboard-button"
                            type="button">Calibrate
                    </button>
                </div>
            </details>

            <details class="options" data-role="options-group-developer" hidden>
                <summary class="options__title" data-i18n="screens.options.developerTitle">Developer</summary>
                <p class="options__hint" data-i18n="screens.options.benchmarkHint">Simulates a fast random game and
                    times each part of the engine to find the slowest one.</p>
                <div class="options__row">
                    <span data-i18n="screens.options.benchmark">Benchmark</span>
                    <button class="options__preview-button options__preview-button--wide"
                            data-i18n="screens.options.benchmarkButton"
                            data-role="benchmark-run-button"
                            type="button">Run benchmark
                    </button>
                </div>
                <canvas class="options__benchmark-preview" data-role="benchmark-preview-canvas" hidden></canvas>
                <p class="options__hint" data-role="benchmark-status" hidden></p>
                <ul class="options__benchmark-results" data-role="benchmark-results" hidden></ul>
                <div class="options__row">
                    <button class="options__preview-button options__preview-button--wide"
                            data-i18n="screens.options.benchmarkCopyButton"
                            data-role="benchmark-copy-button"
                            hidden type="button">Copy results
                    </button>
                </div>
            </details>

            <details class="options" data-role="options-group-data">
                <summary class="options__title" data-i18n="screens.options.dataTitle">Import / Export</summary>
                <div class="options__row">
                    <span data-i18n="screens.options.exportLabel">Export options to a file</span>
                    <button class="options__preview-button options__preview-button--wide"
                            data-i18n="screens.options.exportButton"
                            data-role="options-export-button"
                            type="button">Export
                    </button>
                </div>
                <div class="options__row">
                    <span data-i18n="screens.options.importLabel">Import options from a file</span>
                    <button class="options__preview-button options__preview-button--wide"
                            data-i18n="screens.options.importButton"
                            data-role="options-import-button"
                            type="button">Import
                    </button>
                    <input accept="application/json" data-role="options-import-file" hidden type="file">
                </div>
            </details>
        </div>

        <div class="options options__import-review" data-role="options-import-review" hidden>
            <h3 class="options__title options__title--static" data-i18n="screens.options.importDiffTitle">Import
                options</h3>
            <p class="options__import-review__subtitle" data-role="options-import-subtitle"></p>

<script>
    (function () {
        const appRoot = document.getElementById("app-root");
        const scrim = document.querySelector('[data-role="drawer-scrim"]');
        const drawers = {
            stats: document.querySelector(".sidebar--stats"),
        };
        const fabStats = document.querySelector('[data-role="fab-stats"]');

        function notifyResize() {
            requestAnimationFrame(() => window.dispatchEvent(new Event("resize")));
        }

        function closeDrawers() {
            Object.values(drawers).forEach((el) => el && el.classList.remove("app__sidebar--open"));
            if (fabStats) fabStats.setAttribute("aria-pressed", "false");
            if (scrim) scrim.classList.remove("drawer-scrim--visible");
        }

        function toggleDrawer(name, fab) {
            const el = drawers[name];
            if (!el) return;
            const isOpen = el.classList.contains("app__sidebar--open");
            closeDrawers();
            if (!isOpen) {
                el.classList.add("app__sidebar--open");
                if (fab) fab.setAttribute("aria-pressed", "true");
                if (scrim) scrim.classList.add("drawer-scrim--visible");
            }
            notifyResize();
        }

        if (fabStats) fabStats.addEventListener("click", () => toggleDrawer("stats", fabStats));
        if (scrim) scrim.addEventListener("click", () => {
            closeDrawers();
            notifyResize();
        });
        document.querySelectorAll('[data-role="drawer-close"]').forEach((btn) => {
            btn.addEventListener("click", () => {
                closeDrawers();
                notifyResize();
            });
        });

        function isNativeFullscreen() {
            return Boolean(document.fullscreenElement || document.webkitFullscreenElement);
        }

        function isFullscreen() {
            const fillsScreen = window.innerWidth >= screen.width && window.innerHeight >= screen.height;
            return isNativeFullscreen() || fillsScreen;
        }

        const fullscreenButtons = document.querySelectorAll(
            '[data-role="fab-fullscreen"], [data-role="fullscreen-toggle"]'
        );

        function setFullscreenPressed(pressed) {
            fullscreenButtons.forEach((btn) => btn.setAttribute("aria-pressed", String(pressed)));
        }

        if (fullscreenButtons.length && appRoot) {
            fullscreenButtons.forEach((btn) => btn.addEventListener("click", async () => {
                try {
                    if (isNativeFullscreen()) {
                        if (document.exitFullscreen) await document.exitFullscreen();
                        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                    } else if (!isFullscreen()) {
                        if (appRoot.requestFullscreen) await appRoot.requestFullscreen();
                        else if (appRoot?.webkitRequestFullscreen) appRoot.webkitRequestFullscreen();
                        else document.body.classList.toggle("faux-fullscreen");
                    }
                } catch (err) {
                    document.body.classList.toggle("faux-fullscreen");
                }
                notifyResize();
            }));

            document.addEventListener("fullscreenchange", () => setFullscreenPressed(isFullscreen()));
            document.addEventListener("webkitfullscreenchange", () => setFullscreenPressed(isFullscreen()));
            window.addEventListener("resize", () => setFullscreenPressed(isFullscreen()));
        }

        window.addEventListener("orientationchange", notifyResize);
    })();
</script>
<script src="scripts/app/main.js?v=38" type="module"></script>
