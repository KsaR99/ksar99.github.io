<!DOCTYPE html>
<html lang="en" translate="no">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport">
    <title>Kl0ck1's</title>
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Noto+Sans+Mono:wght@100..900&display=swap"
        rel="stylesheet"
    >
    <link href="styles/main.css?v=95" rel="stylesheet">
    <link href="styles/options.css?v=95" rel="stylesheet">
    <link href="styles/menu.css?v=95" rel="stylesheet">
    <link href="styles/leaderboard.css?v=95" rel="stylesheet">
    <link href="styles/multiplayer.css?v=95" rel="stylesheet">
    <link href="styles/mobile.css?v=95" media="(width < 48rem)" rel="stylesheet">
    <link href="styles/desktop.css?v=95" media="(width >= 48rem)" rel="stylesheet">
    <link href="./favicon.ico" rel="icon">
    <link href="./assets/img/icons/favicon.svg" rel="icon" type="image/svg+xml">
    <link href="./assets/img/icons/favicon-32x32.png" rel="icon" sizes="32x32" type="image/png">
    <link href="./assets/img/icons/favicon-16x16.png" rel="icon" sizes="16x16" type="image/png">
    <link href="./assets/img/icons/apple-touch-icon.png" rel="apple-touch-icon">
    <link href="./assets/img/icons/site.webmanifest" rel="manifest">
    <meta content="scale" name="text-scale">
    <meta content="telephone=no" name="format-detection">
    <meta content="yes" name="mobile-web-app-capable">
    <meta content="yes" name="apple-mobile-web-app-capable">
    <meta content="dark" name="color-scheme">
    <meta content="notranslate" name="google">
    <meta content="https://github.com/KsaR99" name="author">
    <meta content="index, follow" name="robots">
    <meta content="#0a0d15" name="theme-color">
    <meta content="dark" name="color-scheme">
    <meta content="yes" name="apple-mobile-web-app-capable">
    <meta content="black-translucent" name="apple-mobile-web-app-status-bar-style">
    <meta content="Kl0ck1's" name="apple-mobile-web-app-title">
    <meta content="yes" name="mobile-web-app-capable">
    <meta content="A Tetris-ish game, with multiplayer, tons of game modes, extensive customization & themes."
          name="description">
</head>
<body>
<div class="boot-screen" id="boot-screen">
    <div class="boot-screen__inner">
        <p class="boot-screen__logo">Kl0ck1<span class="boot-screen__logo-flip">'s</span></p>
        <div class="boot-screen__bar-track">
            <div class="boot-screen__bar-fill" id="boot-bar-fill"></div>
        </div>
        <p class="boot-screen__status" id="boot-status">&nbsp;</p>
    </div>
</div>
<div class="confirm-overlay" data-role="confirm-overlay" hidden>
    <div aria-modal="true" class="confirm-dialog" data-role="confirm-dialog" role="alertdialog">
        <p class="confirm-dialog__message" data-field="confirm-message"></p>
        <div class="confirm-dialog__actions screen__button-row">
            <button class="button button--primary" data-i18n="controls.cancel" data-role="confirm-cancel-button"
                    type="button">Cancel
            </button>
            <button class="button button--accent" data-i18n="controls.confirm" data-role="confirm-ok-button"
                    type="button">Confirm
            </button>
        </div>
    </div>
</div>
<div class="app" id="app-root">
    <div aria-label="Quick actions" class="mobile-fabs" role="toolbar">
        <div class="mobile-fabs__group">
            <button aria-label="Stats" class="mobile-fab" data-role="fab-stats" type="button">📊</button>
            <button aria-label="Controls" class="mobile-fab" data-role="fab-controls" type="button">⚙️</button>
        </div>
        <div class="mobile-fabs__group">
            <button aria-label="Fullscreen" aria-pressed="false" class="mobile-fab" data-role="fab-fullscreen"
                    type="button">⛶
            </button>
            <button aria-label="Exit" class="mobile-fab exit-match-button" data-role="exit-match-button"
                    type="button">❌
            </button>
        </div>
    </div>
    <div class="drawer-scrim" data-role="drawer-scrim"></div>

    <aside aria-label="Stats sidebar" class="app__sidebar sidebar sidebar--stats">
        <button aria-label="Close" class="drawer-close" data-role="drawer-close" type="button">❌</button>
        <header class="card">
            <p class="brand__title" data-role="brand-title">Kl0ck1<span class="brand__title-flip"
                                                                        data-role="brand-title-flip">'s</span></p>
            <p class="brand__subtitle brand__subtitle--clickable" data-role="brand-version">v0.37-alpha</p>
            <div aria-label="Quick settings" class="settings-shortcut-row" role="toolbar">
                <button aria-label="Mute sound" aria-pressed="false" class="settings-shortcut-icon"
                        data-role="mute-toggle" type="button">
                    <span aria-hidden="true" data-role="mute-toggle-icon">🔊</span>
                </button>
                <button aria-label="Fullscreen" aria-pressed="false" class="settings-shortcut-icon"
                        data-role="fullscreen-toggle" type="button">
                    <span aria-hidden="true">⛶</span>
                </button>
                <button aria-label="Options" class="settings-shortcut-icon" data-role="settings-shortcut"
                        type="button">
                    <span aria-hidden="true">⚙️</span>
                </button>
                <button aria-label="Exit" class="settings-shortcut-icon exit-match-button"
                        data-role="exit-match-button" type="button">
                    <span aria-hidden="true">❌</span>
                </button>
            </div>
        </header>

        <section aria-label="Status" class="card stats" data-role="status-card">
            <p class="stats__status" data-i18n="sidebar.statusLast" data-role="stats-status">Last game</p>
            <div class="stats__row" data-role="time-stat">
                <h3 class="card__title" data-i18n="sidebar.time">Time</h3>
                <div class="stats__value" id="time-value">00:00</div>
            </div>
        </section>

        <section aria-label="Stats" class="card stats" data-role="stats-card">
            <div class="stats__row" data-role="best-stat">
                <h3 class="card__title" data-i18n="sidebar.best">Best</h3>
                <div class="stats__value" id="best-value">0</div>
            </div>
            <div class="stats__row">
                <h3 class="card__title" data-i18n="sidebar.score">Score</h3>
                <div class="stats__value" id="score-value">0</div>
            </div>
            <div class="stats__row" data-role="lines-stat">
                <h3 class="card__title" data-i18n="sidebar.lines">Lines</h3>
                <div class="stats__value" id="lines-value">0</div>
            </div>
            <div class="stats__row" data-role="trt-stat">
                <h3 class="card__title" data-i18n="sidebar.tetrisRate">TRT</h3>
                <div class="stats__value" id="trt-value">0.0%</div>
            </div>
            <div class="stats__row" data-role="pps-stat">
                <h3 class="card__title" data-i18n="sidebar.pps">PPS</h3>
                <div class="stats__value" id="pps-value">0.00</div>
            </div>
            <div class="stats__row" data-role="drought-stat">
                <h3 class="card__title" data-i18n="sidebar.drought">Drought</h3>
                <div class="stats__value" id="drought-value">0</div>
            </div>
            <div data-role="objective-stat">
                <div class="progress-bar progress-bar--objective" id="objective-bar-track">
                    <div class="progress-bar__fill" id="objective-bar"></div>
                    <div class="progress-bar__label" id="objective-value">-</div>
                </div>
            </div>
            <div class="difficulty-indicator" data-role="difficulty-stat">
                <div class="progress-bar progress-bar--difficulty">
                    <div class="progress-bar__fill" id="difficulty-bar"></div>
                    <div class="progress-bar__label" id="difficulty-value">-</div>
                </div>
            </div>
        </section>

        <section aria-labelledby="next-piece-title" class="card card--next-piece" data-role="next-piece-card">
            <h3 class="card__title card__title--next-piece" data-i18n="sidebar.nextPiece" id="next-piece-title">Next
                piece</h3>
            <div class="next-piece__queue" data-role="next-piece-queue">
                <canvas class="next-piece__canvas" height="66" width="132"></canvas>
                <canvas class="next-piece__canvas" height="66" width="132"></canvas>
                <canvas class="next-piece__canvas" height="66" width="132"></canvas>
            </div>
        </section>
    </aside>

    <main class="app__board">
        <div class="board">
            <div aria-hidden="true" class="board__bg"></div>
            <div class="board__stage">
                <canvas class="board__canvas" height="920" id="klockis-board" width="460"></canvas>
                <div class="board__filter board__filter--none" id="filter-overlay">
                    <canvas class="board__filter-canvas" id="filter-canvas"></canvas>
                </div>
                <div class="board__overlay" id="overlay"></div>
                <div aria-hidden="true" class="board__credits" data-role="credits">
                    <div class="board__credits__scroll" data-role="credits-scroll"></div>
                </div>
            </div>
        </div>
    </main>

    <div aria-label="Touch controls" class="touch-controls" data-role="touch-controls" role="toolbar">
        <div class="touch-controls__group touch-controls__group--move">
            <div class="touch-controls__joystick-wrap">
                <button aria-label="Rotate left"
                        class="touch-controls__btn touch-controls__rotate touch-controls__rotate--left"
                        data-key-action="KeyZ" type="button">⟲
                </button>
                <div aria-label="Move" class="touch-controls__joystick" data-role="touch-joystick" role="group">
                    <div class="touch-controls__joystick-base" data-role="touch-joystick-base">
                        <div class="touch-controls__joystick-stick" data-role="touch-joystick-stick"></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="touch-controls__group touch-controls__group--actions">
            <div class="touch-controls__action-stack">
                <button aria-label="Rotate"
                        class="touch-controls__btn touch-controls__rotate touch-controls__rotate--right"
                        data-key-action="ArrowUp" type="button">⟳
                </button>
                <button aria-label="Hard drop" class="touch-controls__btn" data-key-action="Space" type="button">
                    <span class="touch-controls__btn-label">⏬</span>
                </button>
            </div>
            <button aria-label="Pause" class="touch-controls__btn touch-controls__pause" data-key-action="KeyP"
                    type="button">❚❚
            </button>
        </div>
    </div>
</div>

<template id="tpl-screen-loading">
    <section class="screen">
        <h2 class="screen__title" data-field="title"></h2>
        <p class="screen__hint" data-field="hint"></p>
    </section>
</template>

<template id="tpl-screen-mode-info">
    <section class="screen">
        <p class="brand__title">Kl0ck1's</p>
        <h2 class="screen__title mode-info__title" data-field="modeName"></h2>
        <ul class="mode-info__rules" data-field="rules"></ul>
        <button class="button button--accent" data-i18n="screens.modeInfo.continueButton"
                data-role="mode-info-continue-button"
                type="button">Continue
        </button>
    </section>
</template>

<template id="tpl-mode-info-rule">
    <li class="mode-info__rule" data-field="rule"></li>
</template>

<template id="tpl-screen-countdown">
    <section class="screen screen--countdown" data-role="countdown-screen">
        <p class="brand__title">Kl0ck1's</p>
        <div class="countdown__number" data-field="number"></div>
        <div class="progress-bar progress-bar--countdown">
            <div class="progress-bar__fill" data-role="countdown-progress-bar"></div>
        </div>
    </section>
</template>

<template id="tpl-credits-entry">
    <div class="board__credits__entry">
        <a class="board__credits__link" data-field="link" data-role="credits-link" rel="noopener" target="_blank"></a>
        <span class="board__credits__roles" data-field="roles"></span>
    </div>
</template>

<script>
    (function () {
        const appRoot = document.getElementById("app-root");
        const scrim = document.querySelector('[data-role="drawer-scrim"]');
        const drawers = {
            stats: document.querySelector(".sidebar--stats"),
        };
        const fabStats = document.querySelector('[data-role="fab-stats"]');

        function notifyResize() {
            requestAnimationFrame(() => window.dispatchEvent(new Event("resize")));
        }

        function closeDrawers() {
            Object.values(drawers).forEach((el) => el && el.classList.remove("app__sidebar--open"));
            if (fabStats) fabStats.setAttribute("aria-pressed", "false");
            if (scrim) scrim.classList.remove("drawer-scrim--visible");
        }

        function toggleDrawer(name, fab) {
            const el = drawers[name];
            if (!el) return;
            const isOpen = el.classList.contains("app__sidebar--open");
            closeDrawers();
            if (!isOpen) {
                el.classList.add("app__sidebar--open");
                if (fab) fab.setAttribute("aria-pressed", "true");
                if (scrim) scrim.classList.add("drawer-scrim--visible");
            }
            notifyResize();
        }

        if (fabStats) fabStats.addEventListener("click", () => toggleDrawer("stats", fabStats));
        if (scrim) scrim.addEventListener("click", () => {
            closeDrawers();
            notifyResize();
        });
        document.querySelectorAll('[data-role="drawer-close"]').forEach((btn) => {
            btn.addEventListener("click", () => {
                closeDrawers();
                notifyResize();
            });
        });

        function isNativeFullscreen() {
            return Boolean(document.fullscreenElement || document.webkitFullscreenElement);
        }

        function isFullscreen() {
            const fillsScreen = window.innerWidth >= screen.width && window.innerHeight >= screen.height;
            return isNativeFullscreen() || fillsScreen;
        }

        const desktopLayoutQuery = window.matchMedia("(width >= 48rem)");

        function getFullscreenTarget() {
            return desktopLayoutQuery.matches ? document.documentElement : appRoot;
        }

        const fullscreenButtons = document.querySelectorAll(
            '[data-role="fab-fullscreen"], [data-role="fullscreen-toggle"]'
        );

        function setFullscreenPressed(pressed) {
            fullscreenButtons.forEach((btn) => btn.setAttribute("aria-pressed", String(pressed)));
        }

        if (fullscreenButtons.length && appRoot) {
            fullscreenButtons.forEach((btn) => btn.addEventListener("click", async () => {
                try {
                    if (isNativeFullscreen()) {
                        if (document.exitFullscreen) await document.exitFullscreen();
                        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                    } else if (!isFullscreen()) {
                        const target = getFullscreenTarget();
                        if (target.requestFullscreen) await target.requestFullscreen();
                        else if (target?.webkitRequestFullscreen) target.webkitRequestFullscreen();
                        else document.body.classList.toggle("faux-fullscreen");
                    }
                } catch (err) {
                    document.body.classList.toggle("faux-fullscreen");
                }
                notifyResize();
            }));

            document.addEventListener("fullscreenchange", () => setFullscreenPressed(isFullscreen()));
            document.addEventListener("webkitfullscreenchange", () => setFullscreenPressed(isFullscreen()));
            window.addEventListener("resize", () => setFullscreenPressed(isFullscreen()));
        }

        window.addEventListener("orientationchange", notifyResize);
    })();
</script>
<script src="scripts/app/main.js?v=95" type="module"></script>
</body>
</html>
